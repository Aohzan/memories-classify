[project]
name = "memories-classify"
version = "1.2.0"
description = "Sort and organize personnal photos and videos"
keywords = ["picture", "video", "organize", "sort", "encode"]
authors = [{ name = "Aohzan", email = "aohzan@gmail.com" }]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "pillow>=11.1.0",
    "pycountry>=24.6.1",
    "pyyaml>=6.0.2",
    "reverse-geocoder>=1.5.1",
    "tqdm>=4.70.1",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
memories-classify = "classify.main:main"


[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.7",
    "ty>=0.0.15",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["classify*"]

[tool.ruff.lint]
# EXIF and filename dates are local wall-clock times without offset, naive datetimes are intended
extend-ignore = ["DTZ001", "DTZ007"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = """
    pip install uv
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.changelog]
default_templates = { changelog_file = "CHANGELOG.md" }
exclude_commit_patterns = [
    "^chore\\(deps",
]
